<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@400;500;600&display=swap">
<style>
@font-face{font-family:'FiraGO';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/firago@5.3.0/files/firago-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'FiraGO';font-style:normal;font-weight:500;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/firago@5.3.0/files/firago-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'FiraGO';font-style:normal;font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/firago@5.3.0/files/firago-latin-600-normal.woff2) format('woff2')}
:root{--ink:#0D1D2B;--ink-soft:#1B293C;--surface:#FAFAF8;--raised:#FFFFFF;--border:#E3E5E9;--border-strong:#C9CDD4;--muted:#5C6672;--on-dark:#F4F6F5;--on-dark-muted:#9AA6B2;--accent:#1577B0;--accent-700:#0F5C8A;--accent-800:#0B4868;--brand-blue:#1A93D0;--brand-red:#EC3237;--red:#D42A30;--red-700:#B8232A;--accent-tint:#EAF4FA;--accent-tint-2:#D2E8F5;--warning:#B4701E;--warning-ink:#8F5714;--warning-tint:#FBF2E6;--error:#A33A2B;--error-ink:#8C3124;--error-tint:#FBEEEC;--shadow-sm:0 1px 2px rgba(14,26,43,.06);--shadow-md:0 2px 10px rgba(14,26,43,.07);--font:'FiraGO','Noto Sans Georgian',system-ui,sans-serif;--font-head:'Noto Serif Georgian',Georgia,serif}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-700);text-decoration:underline}
input,select,button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<header style="background:var(--raised);border-bottom:1px solid var(--border);font-family:var(--font)">
<div style="background:var(--ink)">
<div style="max-width:1216px;margin:0 auto;padding:0 24px;height:40px;display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:14px;color:var(--on-dark-muted)">
<div style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ licenceLine }}</div>
<div style="flex:none;display:flex;align-items:center;gap:12px">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<div style="width:180px;height:28px;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:0 9px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA6B2" stroke-width="2" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="{{ searchLabel }}" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--on-dark)">
</div>
</sc-if>
<div style="height:28px;display:grid;grid-template-columns:52px 52px;border:1px solid rgba(255,255,255,.18);border-radius:3px;overflow:hidden">
<button onClick="{{ setKa }}" style="border:0;font-size:13.5px;font-weight:500;cursor:pointer;background:{{ kaBg }};color:{{ kaColor }}">ქარ</button>
<button onClick="{{ setEn }}" style="border:0;font-size:13.5px;font-weight:500;cursor:pointer;background:{{ enBg }};color:{{ enColor }}">ENG</button>
</div>
</div>
</div>
</div>
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<div style="max-width:1216px;margin:0 auto;padding:0 24px;height:88px;display:flex;align-items:center;justify-content:space-between;gap:32px">
<a href="#" onClick="{{ goHome }}" style="display:block;flex:none;line-height:0"><img src="assets/nova-credit-logo.png" alt="{{ brand }}" style="height:52px;width:auto;display:block"></a>
<div style="flex:none;display:flex;align-items:center;gap:28px">
<a href="tel:+995322151515" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)">
<span style="width:40px;height:40px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1577B0" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
</span>
<span style="display:flex;flex-direction:column;line-height:1.3;width:170px">
<span style="font-size:13px;color:var(--muted)">{{ hotline }}</span>
<span style="font-size:16.5px;font-weight:500;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap">(+995 32) 2 15 15 15</span>
</span>
</a>
<button onClick="{{ goApply }}" style="width:210px;height:48px;border:1px solid var(--red);border-radius:3px;background:var(--red);color:#fff;font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s" style-hover="background:var(--red-700);border-color:var(--red-700)">{{ applyLabel }}</button>
</div>
</div>
<div style="border-top:1px solid var(--border)">
<nav style="max-width:1216px;margin:0 auto;padding:0 12px;height:52px;display:grid;grid-template-columns:repeat(9,auto);justify-content:space-between;align-items:stretch">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="9">
<button onClick="{{ item.go }}" style="height:52px;padding:0 12px;font-size:15.5px;font-weight:{{ item.weight }};color:{{ item.color }};border:0;border-bottom:3px solid {{ item.rule }};border-top:3px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;outline-offset:-3px;transition:color .15s,background .15s" style-hover="color:var(--accent-700);background:var(--accent-tint)">{{ item.label }}</button>
</sc-for>
</nav>
</div>
</sc-if>
<sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
<div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<a href="#" onClick="{{ goHome }}" style="display:block;line-height:0"><img src="assets/nova-credit-logo.png" alt="{{ brand }}" style="height:40px;width:auto;display:block"></a>
<div style="display:flex;align-items:center;gap:8px">
<button style="width:44px;height:44px;border:1px solid var(--border);border-radius:3px;background:var(--raised);display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0D1D2B" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
</button>
<button onClick="{{ toggleMenu }}" style="width:44px;height:44px;border:1px solid var(--border);border-radius:3px;background:var(--raised);display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D1D2B" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
</button>
</div>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav style="border-top:1px solid var(--border);display:flex;flex-direction:column">
<sc-for list="{{ nav }}" as="item" hint-placeholder-count="9">
<button onClick="{{ item.go }}" style="text-align:left;min-height:48px;padding:10px 16px;border:0;border-bottom:1px solid var(--border);background:{{ item.mbg }};color:{{ item.color }};font-size:17px;font-weight:{{ item.mweight }};cursor:pointer">{{ item.label }}</button>
</sc-for>
</nav>
</sc-if>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:180},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ka&quot;,&quot;en&quot;],&quot;default&quot;:&quot;ka&quot;,&quot;tsType&quot;:&quot;'ka'|'en'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1280&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const NAV = {
  ka: [['home','მთავარი'],['about','ჩვენს შესახებ'],['products','პროდუქტები'],['branches','ფილიალები'],['news','სიახლეები'],['reporting','რეპორტინგი'],['video','ვიდეოგალერეა'],['careers','კარიერა'],['contact','კონტაქტი']],
  en: [['home','Home'],['about','About us'],['products','Products'],['branches','Branches'],['news','News'],['reporting','Reporting'],['video','Video gallery'],['careers','Careers'],['contact','Contact']]
};
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const w = Number(this.props.w || 1280);
    const lang = this.props.lang === 'en' ? 'en' : 'ka';
    const active = this.props.active || 'home';
    return {
      wide: w >= 1100, narrow: w < 1100,
      hotline: lang === 'ka' ? 'ცხელი ხაზი' : 'Hotline',
      applyLabel: lang === 'ka' ? 'სესხის განაცხადი' : 'Loan application',
      goApply: () => this.props.onNavigate && this.props.onNavigate('application'),
      setKa: () => this.props.onLang && this.props.onLang('ka'),
      setEn: () => this.props.onLang && this.props.onLang('en'),
      kaBg: lang === 'ka' ? 'var(--accent)' : 'transparent',
      kaColor: lang === 'ka' ? '#fff' : 'var(--on-dark-muted)',
      enBg: lang === 'en' ? 'var(--accent)' : 'transparent',
      enColor: lang === 'en' ? '#fff' : 'var(--on-dark-muted)',
      brand: lang === 'ka' ? 'ნოვა კრედიტი' : 'Nova Credit',
      brandSub: lang === 'ka' ? 'მიკროსაფინანსო ორგანიზაცია' : 'Microfinance organisation',
      licenceLine: lang === 'ka' ? 'ლიცენზირებული მიკროსაფინანსო ორგანიზაცია · საქართველოს ეროვნული ბანკის ზედამხედველობით' : 'Licensed microfinance organisation · supervised by the National Bank of Georgia',
      searchLabel: lang === 'ka' ? 'ძიება' : 'Search',
      langA: lang === 'ka' ? 'ქარ' : 'ENG',
      langB: lang === 'ka' ? 'ENG' : 'ქარ',
      toggleLang: () => this.props.onLang && this.props.onLang(lang === 'ka' ? 'en' : 'ka'),
      goHome: (e) => { if (e && e.preventDefault) e.preventDefault(); this.props.onNavigate && this.props.onNavigate('home'); },
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      nav: NAV[lang].map(([k, label]) => ({
        label, key: k,
        go: () => { this.setState({ menuOpen: false }); this.props.onNavigate && this.props.onNavigate(k); },
        color: k === active ? 'var(--accent-700)' : 'var(--ink)',
        rule: k === active ? 'var(--accent)' : 'transparent',
        weight: k === active ? '500' : '400',
        mbg: k === active ? 'var(--accent-tint)' : 'var(--raised)',
        mweight: k === active ? '600' : '400'
      }))
    };
  }
}
</script>
</body>
</html>
